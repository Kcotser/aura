# =============================================================================
# AURA — Application Configuration (Dev & Production / Render Ready)
# =============================================================================
spring:
  application:
    name: aura-backend

  # Virtual Threads (Java 21) for I/O-bound operations
  threads:
    virtual:
      enabled: true

  # MongoDB — supports Render MONGODB_URI or local fallback
  data:
    mongodb:
      # La base va en el propio URI. No declarar 'database' aqui: esa propiedad
      # pisa a la del URI, y con el default 'aura_dev' Render terminaba usando
      # aura_dev aunque MONGODB_URI apuntara a aura_prod.
      uri: ${MONGODB_URI:mongodb://localhost:27017/aura_dev}

  # Disable Spring Security default password logging
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}

  # Multipart — evidence uploads carry video files. The Spring defaults (1MB per file,
  # 10MB per request) reject any real recording, so they are raised here: three streams
  # (front camera, back camera, ambient audio) travel in a single request.
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:150MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:400MB}

server:
  port: ${PORT:8080}

# AURA Platform Configuration
aura:
  gemma:
    # Los defaults son obligatorios: un placeholder sin fallback aborta el arranque
    # con "Could not resolve placeholder" si Render no inyecta la variable.
    api-url: ${GEMMA_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash}
    api-key: ${GEMMA_API_KEY:}

  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWZvci1hdXJhLWRvLW5vdC11c2UtaW4tcHJvZA==}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION:30}

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,*}

  rate-limit:
    login:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    pin:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 60

# Actuator — Health & Info Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc / Swagger UI (Active in Production / Render)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.aura: INFO
    org.springframework.security: INFO
