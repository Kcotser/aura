# =============================================================================
# AURA — Application Configuration (Dev & Production / Render Ready)
# =============================================================================
spring:
  application:
    name: aura-backend

  # Virtual Threads (Java 21) for I/O-bound operations
  threads:
    virtual:
      enabled: true

  # MongoDB — supports Render MONGODB_URI or local fallback
  data:
    mongodb:
      uri: mongodb://localhost:27017/aura_dev
      database: aura_dev

  # Disable Spring Security default password logging
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

# AURA Platform Configuration
aura:
  gemma:
    api-url:
    api-key:

  jwt:
    secret: ZGV2LW9ubHktc2VjcmV0LWZvci1hdXJhLWRvLW5vdC11c2UtaW4tcHJvZA==
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30

  security:
    cors:
      allowed-origins: "*"

  rate-limit:
    login:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    pin:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 60

# Actuator — Health & Info Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc / Swagger UI (Active in Production / Render)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.aura: INFO
    org.springframework.security: INFO
