# =============================================================================
# AURA — Production configuration
# ALL secrets must come from environment variables — zero hardcoded values
# =============================================================================
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}

server:
  port: ${SERVER_PORT:8080}

aura:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.aura: ${LOG_LEVEL:INFO}
