# =============================================================================
# Render Infrastructure-as-Code Blueprint for Aura Backend (Spring Boot + Java 21)
# =============================================================================

services:
  - type: web
    name: aura-backend
    env: docker
    rootDir: web-service
    dockerfilePath: Dockerfile
    plan: free
    region: oregon

    # Render health check endpoint
    healthCheckPath: /actuator/health

    envVars:
      - key: PORT
        value: 10000

      # Sensitive Environment Variables — configured securely via Render Dashboard UI
      - key: MONGODB_URI
        sync: false # Set MongoDB Atlas URI in Render UI

      - key: GEMMA_API_KEY
        sync: false # Set Google AI Studio Gemma API Key in Render UI

      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure cryptographically random 256-bit key

      - key: CORS_ALLOWED_ORIGINS
        value: "*"
