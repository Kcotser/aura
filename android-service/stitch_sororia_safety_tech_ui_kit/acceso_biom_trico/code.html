<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#006878",
                    "primary-container": "#5a189a",
                    "secondary-fixed-dim": "#58d6f1",
                    "on-primary-fixed": "#2b0052",
                    "surface-container-high": "#e4e9eb",
                    "on-tertiary-container": "#54bf8e",
                    "on-primary": "#ffffff",
                    "outline-variant": "#cec3d4",
                    "inverse-primary": "#dbb8ff",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#4b4452",
                    "surface": "#f5fafc",
                    "on-tertiary-fixed-variant": "#005235",
                    "secondary-fixed": "#a7edff",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#001f25",
                    "secondary-container": "#69e5ff",
                    "on-surface": "#171c1e",
                    "primary-fixed": "#efdbff",
                    "on-primary-container": "#c896ff",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f5fafc",
                    "tertiary-fixed": "#8df7c2",
                    "outline": "#7d7483",
                    "inverse-surface": "#2c3133",
                    "surface-tint": "#7a3fbb",
                    "on-background": "#171c1e",
                    "on-secondary-fixed-variant": "#004e5b",
                    "surface-dim": "#d6dbdd",
                    "tertiary-fixed-dim": "#71daa7",
                    "surface-variant": "#dee3e5",
                    "surface-container-highest": "#dee3e5",
                    "tertiary-container": "#004a30",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#ecf1f3",
                    "on-tertiary-fixed": "#002113",
                    "tertiary": "#00311f",
                    "primary-fixed-dim": "#dbb8ff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#006575",
                    "on-tertiary": "#ffffff",
                    "surface-container": "#eaeff1",
                    "surface-container-low": "#eff4f6",
                    "background": "#f5fafc",
                    "on-primary-fixed-variant": "#6122a1",
                    "primary": "#3f0075"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target-min": "44px",
                    "xs": "8px",
                    "lg": "24px",
                    "sm": "12px",
                    "button-height": "48px",
                    "md": "16px",
                    "xl": "32px",
                    "input-height": "52px",
                    "list-item-height": "64px",
                    "base": "4px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "critical-data": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "label-md-mobile": ["11px", {"lineHeight": "14px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "critical-data": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-md-mobile": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        /* Custom micro-interactions */
        .radio-card-active {
            border-color: #3f0075 !important;
            background-color: #efdbff !important;
        }
        
        .pin-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #7d7483;
            transition: all 0.2s ease;
        }
        
        .pin-dot.filled {
            background-color: #3f0075;
            border-color: #3f0075;
            transform: scale(1.1);
        }

        .numpad-btn:active {
            background-color: #eaeff1;
            transform: scale(0.95);
        }

        body {
            background-color: #f5fafc;
            color: #171c1e;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .fade-enter {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col">
<!-- Top Navigation (Shell Only, No Bottom Nav for this linear flow) -->
<header class="sticky top-0 w-full z-50 flex items-center justify-between px-4 h-[64px] bg-surface">
<button class="material-symbols-outlined text-primary p-2 hover:bg-surface-container rounded-full transition-colors" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary">SororIA</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 px-4 py-6 max-w-md mx-auto w-full flex flex-col items-center">
<!-- Illustration Section -->
<div class="w-full flex justify-center mb-8 fade-enter">
<div class="relative w-48 h-48 bg-primary-fixed rounded-full flex items-center justify-center">
<!-- Abstract Glow -->
<div class="absolute inset-0 bg-primary opacity-5 rounded-full blur-2xl animate-pulse"></div>
<div class="z-10 bg-white p-6 rounded-full shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 200;">fingerprint</span>
</div>
</div>
</div>
<!-- Headline -->
<div class="text-center mb-10 fade-enter" style="animation-delay: 0.1s;">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Protege tu app</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">Configura un acceso seguro para garantizar que solo tú puedas ver tu información.</p>
</div>
<!-- Options Container -->
<div class="w-full space-y-4 mb-8 fade-enter" style="animation-delay: 0.2s;">
<!-- Option 1: Biometric -->
<label class="relative block group">
<input checked="" class="peer sr-only" name="auth_method" onchange="toggleAuthView('biometric')" type="radio" value="biometric"/>
<div class="flex items-center p-4 border-2 border-surface-container-high bg-surface-container-lowest rounded-xl transition-all peer-checked:border-primary peer-checked:bg-primary-fixed cursor-pointer hover:bg-surface-container-low">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center mr-4 group-peer-checked:bg-primary">
<span class="material-symbols-outlined text-on-surface-variant group-peer-checked:text-white" data-icon="face">face</span>
</div>
<div class="flex-1">
<div class="flex items-center">
<span class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Usar Huella / Face ID</span>
<span class="ml-2 px-2 py-0.5 bg-[#d1fae5] text-[#065f46] font-label-md text-[10px] rounded-full uppercase tracking-wider">Más rápido</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Acceso instantáneo y seguro</p>
</div>
<div class="material-symbols-outlined text-outline group-peer-checked:text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</div>
</div>
</label>
<!-- Option 2: PIN -->
<label class="relative block group">
<input class="peer sr-only" name="auth_method" onchange="toggleAuthView('pin')" type="radio" value="pin"/>
<div class="flex items-center p-4 border-2 border-surface-container-high bg-surface-container-lowest rounded-xl transition-all peer-checked:border-primary peer-checked:bg-primary-fixed cursor-pointer hover:bg-surface-container-low">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center mr-4 group-peer-checked:bg-primary">
<span class="material-symbols-outlined text-on-surface-variant group-peer-checked:text-white" data-icon="dialpad">dialpad</span>
</div>
<div class="flex-1">
<span class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Usar Código PIN</span>
<p class="font-body-md text-body-md text-on-surface-variant">Código numérico de 4 dígitos</p>
</div>
<div class="material-symbols-outlined text-outline group-peer-checked:text-primary opacity-0 group-peer-checked:opacity-100" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</div>
</div>
</label>
</div>
<!-- Numerical Keyboard (Hidden by default, shown when PIN selected) -->
<div class="hidden w-full fade-enter pt-4" id="pin-section">
<div class="flex justify-center gap-4 mb-8">
<div class="pin-dot" id="dot-0"></div>
<div class="pin-dot" id="dot-1"></div>
<div class="pin-dot" id="dot-2"></div>
<div class="pin-dot" id="dot-3"></div>
</div>
<div class="grid grid-cols-3 gap-y-4 gap-x-8 max-w-[280px] mx-auto">
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(1)">1</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(2)">2</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(3)">3</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(4)">4</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(5)">5</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(6)">6</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(7)">7</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(8)">8</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(9)">9</button>
<div class="h-14 w-14"></div>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handlePin(0)">0</button>
<button class="numpad-btn h-14 w-14 rounded-full flex items-center justify-center font-headline-md text-on-surface" onclick="handleDelete()">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="mt-auto w-full pt-10 pb-8">
<button class="w-full h-[48px] bg-primary-container text-on-primary font-headline-md-mobile text-headline-md-mobile rounded-full shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                Confirmar y continuar
                <span class="material-symbols-outlined text-xl" data-icon="chevron_right">chevron_right</span>
</button>
<button class="w-full mt-4 text-outline font-label-md text-center py-2">Omitir por ahora</button>
</div>
</main>
<script>
        let pin = [];
        const pinSection = document.getElementById('pin-section');

        function toggleAuthView(method) {
            if (method === 'pin') {
                pinSection.classList.remove('hidden');
                pinSection.classList.add('flex', 'flex-col');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else {
                pinSection.classList.add('hidden');
                pinSection.classList.remove('flex', 'flex-col');
                pin = [];
                updatePinDisplay();
            }
        }

        function handlePin(digit) {
            if (pin.length < 4) {
                pin.push(digit);
                updatePinDisplay();
                
                // Haptic feedback simulation
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(50);
                }
            }
        }

        function handleDelete() {
            pin.pop();
            updatePinDisplay();
        }

        function updatePinDisplay() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < pin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }
    </script>
</body></html>
