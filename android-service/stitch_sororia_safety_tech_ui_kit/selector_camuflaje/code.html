<script>
        function selectOption(element, value) {
            // Remove selection from all
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
                card.querySelector('.check-icon').classList.add('hidden');
            });
            
            // Add selection to clicked
            element.classList.add('selected');
            element.querySelector('.check-icon').classList.remove('hidden');
            
            // Interaction feedback
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Initialize with first selection
        document.addEventListener('DOMContentLoaded', () => {
            const firstOption = document.querySelector('.option-card');
            if(firstOption) selectOption(firstOption, 'calculator');
        });
    </script>
