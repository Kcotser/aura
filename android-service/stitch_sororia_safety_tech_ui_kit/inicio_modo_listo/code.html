<script>
        // Micro-interaction for the SOS button
        const sosButton = document.getElementById('sosTrigger');
        let pressTimer;

        sosButton.addEventListener('mousedown', startPress);
        sosButton.addEventListener('touchstart', startPress);
        sosButton.addEventListener('mouseup', endPress);
        sosButton.addEventListener('mouseleave', endPress);
        sosButton.addEventListener('touchend', endPress);

        function startPress(e) {
            e.preventDefault();
            sosButton.classList.add('bg-error');
            sosButton.classList.remove('bg-primary-container');
            
            pressTimer = window.setTimeout(function() {
                // Logic for activation
                alert('¡SOS ACTIVADO! Notificando a tu red de apoyo...');
            }, 1500);
        }

        function endPress() {
            clearTimeout(pressTimer);
            sosButton.classList.remove('bg-error');
            sosButton.classList.add('bg-primary-container');
        }
    </script>
