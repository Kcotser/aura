<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">

</div>
<button class="w-10 h-10 flex items-center justify-center hover:bg-surface-container rounded-full">

</button>
</header>
<!-- Main Content (Faded Background Content) -->
<main class="flex-1 px-4 py-6 overflow-y-auto">
<div class="space-y-6 opacity-40">
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-outline-variant">
<div class="flex items-center gap-4 mb-4">
<div class="w-12 h-12 bg-secondary-container rounded-full flex items-center justify-center">

</div>
<div>

<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Fecha: 24 Oct, 2023</p>
</div>
</div>
<div class="h-32 w-full rounded-lg bg-surface-container-high animate-pulse"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-white p-4 rounded-xl border border-outline-variant aspect-square flex flex-col justify-end">

</div>
</div>

<!-- Bottom Sheet Overlay -->

<div class="w-full bg-surface-container-lowest rounded-t-[28px] h-[530px] flex flex-col shadow-[0px_-8px_24px_rgba(0,0,0,0.15)] bottom-sheet-content">
<!-- Handle -->
<div class="w-full flex justify-center py-4">
<div class="w-8 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Title & Header -->
<div class="px-6 mb-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Exportar Reporte</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Selecciona el medio para compartir el informe de seguridad.</p>
</div>
<!-- Scrollable Content -->

<div class="bg-primary-container/10 border border-primary-container/20 p-4 rounded-xl flex items-start gap-4">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1">info</span>
<p class="font-body-md text-body-md text-primary-fixed-variant">
                        Incluye reporte narrativo y enlace cifrado para acceso seguro.
                    </p>
</div>
<!-- Export List -->
<div class="space-y-2">
<!-- Item 1: PDF -->
<button class="w-full h-[64px] flex items-center justify-between px-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors active:scale-[0.98] duration-200">

</button>

                    Cancelar
                </button>
</div>
</div>
</div>
<!-- No Bottom Navigation as per prompt instructions -->
<script>
        // Micro-interaction for the list items
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                let ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.width = '100px';
                ripple.style.height = '100px';
                ripple.style.background = 'rgba(255,255,255,0.3)';
                ripple.style.borderRadius = '50%';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.transform = 'translate(-50%, -50%) scale(0)';
                ripple.style.animation = 'ripple 0.6s linear';
                ripple.style.pointerEvents = 'none';
                
                btn.style.position = 'relative';
                btn.style.overflow = 'hidden';
                btn.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Add keyframe for ripple
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes ripple {
                to {
                    transform: translate(-50%, -50%) scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
