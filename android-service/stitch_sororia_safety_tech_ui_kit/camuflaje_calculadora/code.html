<style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .calc-btn {
            @apply flex items-center justify-center rounded-full transition-all active:brightness-125 duration-100;
            width: 80px;
            height: 80px;
            font-size: 32px;
        }

        .calc-btn-sm {
            @apply flex items-center justify-center rounded-full transition-all active:brightness-125 duration-100;
            width: 80px;
            height: 80px;
            font-size: 28px;
        }

        .btn-gray-dark { background-color: #333333; color: #ffffff; }
        .btn-gray-light { background-color: #a5a5a5; color: #000000; }
        .btn-orange { background-color: #ff9f0a; color: #ffffff; }
        
        .btn-zero {
            width: 176px;
            justify-content: flex-start;
            padding-left: 30px;
            border-radius: 40px;
        }

        #display {
            font-size: 80px;
            font-weight: 300;
            letter-spacing: -2px;
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding-right: 32px;
            padding-bottom: 8px;
        }

        /* Discreet Status Indicator (Secret Recording) */
        .secret-indicator {
            position: fixed;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #1a1a1a; /* Almost invisible */
            border-radius: 50%;
            z-index: 100;
        }

        /* Animation for secret recording pulse - barely perceptible */
        @keyframes subtle-pulse {
            0% { opacity: 0.1; }
            50% { opacity: 0.2; }
            100% { opacity: 0.1; }
        }
        .recording-active {
            animation: subtle-pulse 4s infinite ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex flex-col h-screen max-w-[390px] mx-auto overflow-hidden">
<!-- Secret Internal Indicator for the system (not visible to casual observer) -->
<div class="secret-indicator recording-active"></div>
<!-- Top Spacer for iOS-like Status Bar space -->
<div class="h-12"></div>
<!-- Main Display Area -->
<div class="flex-grow flex flex-col justify-end">
<div class="text-right px-8 text-gray-500 font-light text-2xl h-8 overflow-hidden" id="display-history"></div>
<div id="display">0</div>
</div>
<!-- Keypad Grid -->
<div class="grid grid-cols-4 gap-3 p-4 pb-12">
<!-- Row 1 -->
<button class="calc-btn-sm btn-gray-light" id="btn-clear" onclick="clearDisplay()">AC</button>
<button class="calc-btn-sm btn-gray-light" onclick="toggleSign()">+/-</button>
<button class="calc-btn-sm btn-gray-light" onclick="appendPercent()">%</button>
<button class="calc-btn btn-orange material-symbols-outlined" onclick="setOperator('/')">division</button>
<!-- Row 2 -->
<button class="calc-btn btn-gray-dark" onclick="appendNumber('7')">7</button>
<button class="calc-btn btn-gray-dark" onclick="appendNumber('8')">8</button>
<button class="calc-btn btn-gray-dark" onclick="appendNumber('9')">9</button>
<button class="calc-btn btn-orange material-symbols-outlined" onclick="setOperator('*')">close</button>
<!-- Row 3 -->
<button class="calc-btn btn-gray-dark" onclick="appendNumber('4')">4</button>
<button class="calc-btn btn-gray-dark" onclick="appendNumber('5')">5</button>
<button class="calc-btn btn-gray-dark" onclick="appendNumber('6')">6</button>
<button class="calc-btn btn-orange material-symbols-outlined" onclick="setOperator('-')">remove</button>
<!-- Row 4 -->
<button class="calc-btn btn-gray-dark" onclick="appendNumber('1')">1</button>
<button class="calc-btn btn-gray-dark" onclick="appendNumber('2')">2</button>
<button class="calc-btn btn-gray-dark" onclick="appendNumber('3')">3</button>
<button class="calc-btn btn-orange material-symbols-outlined" onclick="setOperator('+')">add</button>
<!-- Row 5 -->
<button class="calc-btn btn-zero btn-gray-dark col-span-2" onclick="appendNumber('0')">0</button>
<button class="calc-btn btn-gray-dark" onclick="appendDecimal()">,</button>
<button class="calc-btn btn-orange material-symbols-outlined" onclick="calculate()">equal</button>
</div>
<!-- Subtle exit sequence script (Not visible) -->
<script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetScreen = false;

        const displayElement = document.getElementById('display');
        const historyElement = document.getElementById('display-history');

        function updateDisplay() {
            // Format number with thousands separator if needed
            let formatted = currentInput;
            if (formatted.length > 9) {
                displayElement.style.fontSize = (80 - (formatted.length - 9) * 6) + 'px';
            } else {
                displayElement.style.fontSize = '80px';
            }
            displayElement.innerText = formatted.replace('.', ',');
        }

        function appendNumber(num) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = num;
                shouldResetScreen = false;
            } else {
                if (currentInput.length < 9) {
                    currentInput += num;
                }
            }
            document.getElementById('btn-clear').innerText = 'C';
            updateDisplay();
        }

        function appendDecimal() {
            if (shouldResetScreen) {
                currentInput = '0,';
                shouldResetScreen = false;
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            document.getElementById('btn-clear').innerText = 'AC';
            updateDisplay();
        }

        function setOperator(op) {
            if (operator !== null) calculate();
            previousInput = currentInput;
            operator = op;
            shouldResetScreen = true;
        }

        function toggleSign() {
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function appendPercent() {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
        }

        function calculate() {
            if (operator === null || shouldResetScreen) return;
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = prev / current; break;
                default: return;
            }

            // Discreet trigger sequence check
            // If the user enters a specific code (e.g. 911 + =), it could trigger an exit
            // But here we keep it as a "pure" calculator for camouflage
            
            currentInput = result.toString();
            operator = null;
            shouldResetScreen = true;
            updateDisplay();
        }

        // Haptic feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });

        // Initialize display
        updateDisplay();

        // Secret Feature Logic: 
        // In a real app, this calculator would look and act 100% normal
        // while the background processes (microphone, GPS) are active.
        console.log("Camouflage mode active. Stealth recording in progress...");
    </script>
