<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5fafc;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .contact-slot {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .contact-slot:active {
            transform: scale(0.98);
            background-color: rgba(90, 24, 154, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top Navigation Bar (Back and Title) -->
<header class="sticky top-0 w-full z-50 flex items-center justify-between px-4 h-[64px] bg-surface">
<button class="flex items-center justify-center w-10 h-10 hover:bg-surface-container rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md-mobile font-bold text-primary">SororIA</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex flex-col px-4 pt-6 pb-xl max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="mb-xl">
<h1 class="font-headline-lg text-headline-lg-mobile text-on-surface mb-xs">Elige a quién avisar</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                En caso de emergencia, estas personas recibirán tu ubicación y un audio en tiempo real.
            </p>
</div>
<!-- Contact Slots Grid (Bento/Card Style) -->
<div class="grid grid-cols-1 gap-md mb-lg">
<!-- Slot 1 -->
<button class="contact-slot flex flex-col items-center justify-center h-[120px] rounded-xl border-2 border-dashed border-primary-container bg-surface-container-low">
<span class="material-symbols-outlined text-primary-container text-3xl mb-xs">person_add</span>
<span class="font-label-md text-label-md text-primary-container uppercase tracking-wider">Añadir contacto 1</span>
</button>
<!-- Slot 2 -->
<button class="contact-slot flex flex-col items-center justify-center h-[120px] rounded-xl border-2 border-dashed border-primary-container bg-surface-container-low">
<span class="material-symbols-outlined text-primary-container text-3xl mb-xs">person_add</span>
<span class="font-label-md text-label-md text-primary-container uppercase tracking-wider">Añadir contacto 2</span>
</button>
<!-- Slot 3 -->
<button class="contact-slot flex flex-col items-center justify-center h-[120px] rounded-xl border-2 border-dashed border-primary-container bg-surface-container-low">
<span class="material-symbols-outlined text-primary-container text-3xl mb-xs">person_add</span>
<span class="font-label-md text-label-md text-primary-container uppercase tracking-wider">Añadir contacto 3</span>
</button>
</div>
<!-- Secondary Action -->
<button class="flex items-center justify-center h-button-height w-full rounded-full border border-secondary text-secondary font-label-md mb-xl hover:bg-secondary-container hover:bg-opacity-10 transition-all active:scale-95">
<span class="material-symbols-outlined mr-xs text-[20px]">import_contacts</span>
            Importar desde contactos
        </button>
<!-- Informative Privacy Chip -->
<div class="flex items-center bg-surface-container-high p-md rounded-lg mb-xl">
<span class="material-symbols-outlined text-secondary mr-sm">security</span>
<p class="font-label-md text-label-md text-on-surface-variant leading-tight">
                Tus contactos solo serán notificados si activas el modo SOS o una alerta de seguridad.
            </p>
</div>
<!-- Footer Actions (Fixed or Bottom Align) -->
<div class="mt-auto flex flex-col gap-sm">
<button class="flex items-center justify-center h-button-height w-full rounded-full bg-primary-container text-on-primary font-label-md shadow-lg active:scale-95 transition-transform">
                Guardar y continuar
            </button>
<a class="text-center py-xs font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">
                Configurar esto después
            </a>
</div>
</main>
<!-- Illustrative atmospheric element -->
<div class="fixed -bottom-10 -right-10 w-48 h-48 bg-primary-container opacity-5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed top-20 -left-10 w-32 h-32 bg-secondary opacity-5 rounded-full blur-2xl pointer-events-none"></div>
