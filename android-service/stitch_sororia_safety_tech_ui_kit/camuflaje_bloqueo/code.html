<style>

        /* Subtle interaction for long press exit (Simulating OS behavior) */
        .exit-trigger {
            position: absolute;

            left: 0;
            width: 100%;

<body class="flex flex-col h-screen w-full justify-between items-center py-12 px-6">
<!-- Mock Native Status Bar -->
<div class="w-full flex justify-between items-center px-4 fixed top-0 left-0 pt-3 opacity-90">
<div class="flex items-center gap-1">
<span class="text-[14px] font-medium">9:41</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined status-bar-icon" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined status-bar-icon" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined status-bar-icon" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Main Simulated Content -->
<main class="flex flex-col items-center justify-center flex-1 mt-[-40px]">
<div class="digital-clock font-headline-lg-mobile text-white mb-2" id="clock">
            09:41
        </div>
<div class="text-on-surface-variant font-body-lg text-[20px] text-[#808080]" id="date">
            martes, 24 de octubre
        </div>
</main>
<!-- Hidden Interaction Zone (Instructional for Designer: Long press to exit) -->
<div class="exit-trigger" id="exitZone"></div>
<script>
        // Real-time clock update
        function updateClock() {
            const now = new Date();
            
            // Time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Date
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const dateStr = now.toLocaleDateString('es-ES', options);
            document.getElementById('date').textContent = dateStr;
        }

        // Run immediately and then every minute
        updateClock();
        setInterval(updateClock, 1000);

        // Interaction simulation: A long press or triple tap could be used to return to the real app
        // Here we simulate a "locked" state where standard touches do nothing.
        const exitTrigger = document.getElementById('exitZone');
        let pressTimer;

        exitTrigger.addEventListener('touchstart', (e) => {
            pressTimer = window.setTimeout(() => {
                // Simulate exit back to main app - In a real scenario, this would navigate back
                console.log('Exit triggered via long press');
            }, 3000);
        });

        exitTrigger.addEventListener('touchend', (e) => {
            clearTimeout(pressTimer);
        });

        // Prevent typical browser behaviors to enhance "Lock Screen" feel
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Disable dragging and context gestures
        window.onscroll = function () { window.scrollTo(0, 0); };
    </script>
</body></html>
