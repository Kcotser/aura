<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#006878",
                    "primary-container": "#5a189a",
                    "secondary-fixed-dim": "#58d6f1",
                    "on-primary-fixed": "#2b0052",
                    "surface-container-high": "#e4e9eb",
                    "on-tertiary-container": "#54bf8e",
                    "on-primary": "#ffffff",
                    "outline-variant": "#cec3d4",
                    "inverse-primary": "#dbb8ff",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#4b4452",
                    "surface": "#f5fafc",
                    "on-tertiary-fixed-variant": "#005235",
                    "secondary-fixed": "#a7edff",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#001f25",
                    "secondary-container": "#69e5ff",
                    "on-surface": "#171c1e",
                    "primary-fixed": "#efdbff",
                    "on-primary-container": "#c896ff",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f5fafc",
                    "tertiary-fixed": "#8df7c2",
                    "outline": "#7d7483",
                    "inverse-surface": "#2c3133",
                    "surface-tint": "#7a3fbb",
                    "on-background": "#171c1e",
                    "on-secondary-fixed-variant": "#004e5b",
                    "surface-dim": "#d6dbdd",
                    "tertiary-fixed-dim": "#71daa7",
                    "surface-variant": "#dee3e5",
                    "surface-container-highest": "#dee3e5",
                    "tertiary-container": "#004a30",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#ecf1f3",
                    "on-tertiary-fixed": "#002113",
                    "tertiary": "#00311f",
                    "primary-fixed-dim": "#dbb8ff",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#006575",
                    "on-tertiary": "#ffffff",
                    "surface-container": "#eaeff1",
                    "surface-container-low": "#eff4f6",
                    "background": "#f5fafc",
                    "on-primary-fixed-variant": "#6122a1",
                    "primary": "#3f0075"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target-min": "44px",
                    "xs": "8px",
                    "lg": "24px",
                    "sm": "12px",
                    "button-height": "48px",
                    "md": "16px",
                    "xl": "32px",
                    "input-height": "52px",
                    "list-item-height": "64px",
                    "base": "4px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "critical-data": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "label-md-mobile": ["11px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "critical-data": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-md-mobile": ["18px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5fafc;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom micro-interactions */
        .bottom-sheet-transition {
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }
        .backdrop-blur-sm {
            backdrop-filter: blur(4px);
        }
        .floating-label-input:focus-within label,
        .floating-label-input input:not(:placeholder-shown) + label {
            transform: translateY(-20px) scale(0.85);
            color: #3f0075;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen overflow-hidden">
<!-- Main Content Background (Simulated Screen Behind) -->
<div class="p-md opacity-40 select-none pointer-events-none">
<header class="flex items-center justify-between h-[64px]">
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary">Red de Apoyo</h1>
<span class="material-symbols-outlined">search</span>
</header>
<div class="mt-lg space-y-md">
<div class="h-list-item-height bg-surface-container rounded-lg"></div>
<div class="h-list-item-height bg-surface-container rounded-lg"></div>
<div class="h-list-item-height bg-surface-container rounded-lg"></div>
</div>
</div>
<!-- Backdrop Overlay -->
<div class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-[50]" id="backdrop"></div>
<!-- Bottom Sheet 'Agregar Contacto' -->
<div class="fixed bottom-0 left-0 right-0 h-[65%] bg-surface-container-lowest rounded-t-[28px] shadow-[0px_-8px_24px_rgba(0,0,0,0.08)] z-[60] flex flex-col bottom-sheet-transition translate-y-0" id="bottomSheet">
<!-- Drag Handle -->
<div class="flex justify-center py-sm">
<div class="w-8 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-md flex-1 overflow-y-auto pb-xl">
<!-- Header -->
<div class="flex items-center justify-between mb-lg">
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Agregar Contacto</h2>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Import Button Section -->
<button class="w-full flex items-center justify-center gap-xs h-button-height border-2 border-outline-variant rounded-full text-primary font-label-md text-label-md-mobile hover:bg-primary-fixed/20 transition-all active:scale-95 mb-xl">
<span class="material-symbols-outlined">contact_page</span>
                Importar desde contactos
            </button>
<!-- Inputs Group -->
<div class="space-y-xl">
<!-- Nombre -->
<div class="relative floating-label-input">
<input class="w-full h-input-height px-md pt-base border-b-2 border-outline bg-surface-container-low rounded-t-lg focus:outline-none focus:border-primary transition-colors peer" id="nombre" placeholder=" " type="text"/>
<label class="absolute left-md top-4 text-on-surface-variant font-body-md pointer-events-none transition-all" for="nombre">Nombre completo</label>
</div>
<!-- Teléfono -->
<div class="relative floating-label-input">
<input class="w-full h-input-height px-md pt-base border-b-2 border-outline bg-surface-container-low rounded-t-lg focus:outline-none focus:border-primary transition-colors peer" id="telefono" placeholder=" " type="tel"/>
<label class="absolute left-md top-4 text-on-surface-variant font-body-md pointer-events-none transition-all" for="telefono">Número de teléfono</label>
</div>
<!-- Relación -->
<div class="relative floating-label-input">
<select class="w-full h-input-height px-md pt-sm border-b-2 border-outline bg-surface-container-low rounded-t-lg focus:outline-none focus:border-primary appearance-none text-on-surface" id="relacion">
<option disabled="" selected="" value=""></option>
<option value="familia">Familia</option>
<option value="amigo">Amigo/a</option>
<option value="pareja">Pareja</option>
<option value="otro">Otro</option>
</select>
<label class="absolute left-md top-4 text-on-surface-variant font-body-md pointer-events-none transition-all" for="relacion">Relación</label>
<span class="material-symbols-outlined absolute right-md top-4 pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Informative Blue Box -->
<div class="mt-xl p-md bg-secondary-container/30 border border-secondary-container rounded-xl flex gap-md">
<span class="material-symbols-outlined text-on-secondary-container">info</span>
<p class="font-body-md text-on-secondary-container">
                    Este contacto recibirá una notificación por SMS en caso de que actives una alerta SOS de emergencia.
                </p>
</div>
<!-- Actions -->
<div class="mt-xl space-y-md">
<button class="w-full h-button-height bg-primary text-on-primary rounded-full font-headline-md-mobile text-label-md-mobile shadow-lg active:scale-95 transition-transform">
                    Guardar contacto
                </button>
<button class="w-full h-button-height flex items-center justify-center text-on-surface-variant font-label-md text-label-md-mobile hover:text-error transition-colors" id="cancelBtn">
                    Cancelar
                </button>
</div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        const sheet = document.getElementById('bottomSheet');
        const backdrop = document.getElementById('backdrop');
        const cancelBtn = document.getElementById('cancelBtn');

        function closeSheet() {
            sheet.style.transform = 'translateY(100%)';
            backdrop.style.opacity = '0';
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 300);
        }

        cancelBtn.addEventListener('click', closeSheet);
        backdrop.addEventListener('click', closeSheet);

        // Simple animation on load
        window.addEventListener('DOMContentLoaded', () => {
            sheet.style.transform = 'translateY(100%)';
            setTimeout(() => {
                sheet.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
