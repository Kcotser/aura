<style>
        body { font-family: 'Inter', sans-serif; background-color: #f5fafc; overflow: hidden; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bottom-sheet-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s ease;
        }
        .bottom-sheet-content {
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
            transform: translateY(100%);
        }
        .bottom-sheet-active .bottom-sheet-content {
            transform: translateY(0);
        }
        .red-stripe {
            height: 4px;
            background-color: #ba1a1a;
            width: 100%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Background Content Layer (Simulated App State) -->
<main class="flex-grow flex flex-col p-md space-y-md opacity-40 select-none pointer-events-none">
<header class="h-[64px] flex items-center justify-between">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary">SororIA</h1>
<div class="w-10"></div>
</header>
<section class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<div class="h-4 w-3/4 bg-surface-dim rounded mb-xs"></div>
<div class="h-4 w-1/2 bg-surface-dim rounded mb-md"></div>
<div class="aspect-video w-full bg-surface-dim rounded-lg"></div>
</section>
<section class="space-y-sm">
<div class="h-list-item-height w-full bg-surface-container rounded-lg flex items-center px-md">
<div class="w-8 h-8 rounded-full bg-surface-dim mr-sm"></div>
<div class="flex-grow space-y-1">
<div class="h-3 w-1/3 bg-surface-dim rounded"></div>
<div class="h-2 w-1/2 bg-surface-dim rounded"></div>
</div>
</div>
<div class="h-list-item-height w-full bg-surface-container rounded-lg flex items-center px-md">
<div class="w-8 h-8 rounded-full bg-surface-dim mr-sm"></div>
<div class="flex-grow space-y-1">
<div class="h-3 w-1/4 bg-surface-dim rounded"></div>
<div class="h-2 w-1/3 bg-surface-dim rounded"></div>
</div>
</div>
</section>
</main>
<!-- Bottom Sheet UI Container -->
<div class="fixed inset-0 z-50 flex items-end bottom-sheet-overlay" id="bottomSheetContainer">
<!-- Main Sheet Area -->
<div class="bottom-sheet-content bg-surface-container-lowest w-full rounded-t-[28px] overflow-hidden flex flex-col shadow-[0px_-8px_24px_rgba(0,0,0,0.12)] h-[55%]">
<!-- Mandatory Red Stripe -->
<div class="red-stripe"></div>
<!-- Handle / Header area -->
<div class="flex flex-col items-center pt-xs pb-sm">
<div class="w-8 h-1 bg-outline-variant rounded-full mb-md"></div>
</div>
<!-- Scrollable Content -->
<div class="flex-grow px-xl overflow-y-auto flex flex-col items-center text-center">
<!-- Alert Icon -->
<div class="mb-md">
<span class="material-symbols-outlined text-[48px] text-error" style="font-variation-settings: 'FILL' 1;">
                        warning
                    </span>
</div>
<!-- Title -->
<h2 class="font-headline-lg text-headline-lg-mobile text-error mb-sm leading-tight">
                    Eliminar Archivos Crudos
                </h2>
<!-- Description -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mb-lg">
                    Esta acción es permanente. Se eliminarán todas las grabaciones locales no procesadas de esta sesión para proteger tu privacidad.
                </p>
<!-- Data Privacy Indicator -->
<div class="bg-error-container/20 border border-error-container p-sm rounded-lg flex items-center space-x-sm mb-xl w-full text-left">
<span class="material-symbols-outlined text-error text-[20px]">security</span>
<span class="font-label-md text-label-md text-on-error-container">Protocolo de limpieza de seguridad activado</span>
</div>
</div>
<!-- Footer Action Buttons -->
<div class="p-xl space-y-sm">
<button class="w-full h-button-height bg-error text-on-error font-body-lg text-body-lg rounded-full flex items-center justify-center space-x-sm active:scale-95 transition-transform shadow-lg shadow-error/20">
<span class="material-symbols-outlined text-[20px]">delete_forever</span>
<span>Sí, eliminar ahora</span>
</button>
<button class="w-full h-button-height bg-transparent text-on-surface-variant font-body-lg text-body-lg rounded-full flex items-center justify-center hover:bg-surface-container transition-colors" id="closeSheet">
                    Cancelar
                </button>
</div>
<!-- Bottom Safe Area Spacer -->
<div class="h-4"></div>
</div>
</div>
<!-- UI Interaction Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('bottomSheetContainer');
            const closeBtn = document.getElementById('closeSheet');

            // Trigger enter animation
            setTimeout(() => {
                container.classList.add('bottom-sheet-active');
            }, 100);

            // Close function
            const closeSheet = () => {
                container.classList.remove('bottom-sheet-active');
                container.style.opacity = '0';
                setTimeout(() => {
                    // In a real app, this would navigate away or remove the element
                    console.log('Sheet closed');
                }, 400);
            };

            closeBtn.addEventListener('click', closeSheet);
            
            // Interaction: Tap overlay to close
            container.addEventListener('click', (e) => {
                if (e.target === container) closeSheet();
            });
        });
    </script>
