<!DOCTYPE html>

<html class="light" lang="es"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        
        .pulse-animation {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        .vibration-effect {
            animation: vibrate 0.1s linear infinite;
        }

        @keyframes vibrate {
            0% { transform: translate(0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, 1px); }
        }

        .loading-ring {
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            animation: dash 3s linear forwards;
        }

        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }

        .fade-overlay {
            background-color: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5fafc;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col h-[844px] w-[390px] mx-auto overflow-hidden relative shadow-2xl bg-surface">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-50 flex items-center justify-between px-4 h-[64px] bg-surface dark:bg-surface-dim">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined p-2 text-primary dark:text-inverse-primary hover:bg-surface-container dark:hover:bg-surface-container-high rounded-full transition-colors duration-200">
                arrow_back
            </button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-inverse-primary">SororIA</h1>
</div>
<button class="material-symbols-outlined p-2 text-primary dark:text-inverse-primary">
            more_vert
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-1 relative flex flex-col items-center justify-center px-md overflow-hidden">
<!-- Background Decorative Elements (Faded Context) -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="grid grid-cols-2 gap-4 p-4 h-full">
<div class="bg-surface-container-high rounded-xl h-32"></div>
<div class="bg-surface-container-high rounded-xl h-32"></div>
<div class="bg-surface-container-high rounded-xl h-48 col-span-2"></div>
<div class="bg-surface-container-high rounded-xl h-32"></div>
<div class="bg-surface-container-high rounded-xl h-32"></div>
</div>
</div>
<!-- Dim Overlay (10%) -->
<div class="absolute inset-0 fade-overlay z-10"></div>
<!-- Central Action Area -->
<div class="relative z-20 flex flex-col items-center">
<!-- Vibration Waves -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-64 h-64 rounded-full border-4 border-error/20 pulse-animation"></div>
<div class="absolute w-80 h-80 rounded-full border-2 border-error/10 pulse-animation" style="animation-delay: 0.5s;"></div>
</div>
<!-- Central SOS Button with Progress Ring -->
<div class="relative w-56 h-56 flex items-center justify-center vibration-effect">
<svg class="absolute inset-0 w-full h-full -rotate-90">
<circle class="text-surface-container" cx="112" cy="112" fill="transparent" r="90" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-error loading-ring" cx="112" cy="112" fill="transparent" r="90" stroke="currentColor" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="w-40 h-40 bg-error rounded-full flex flex-col items-center justify-center text-on-error shadow-xl elevation-2">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">emergency_share</span>
<span class="font-critical-data text-critical-data mt-2 uppercase tracking-widest">SOS</span>
</div>
</div>
<!-- Text Prompt -->
<div class="mt-12 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold">Activando Alerta</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2 font-medium">Suelta para cancelar</p>
</div>
<!-- Camouflage Indicator -->
<div class="mt-8 px-4 py-2 bg-surface-container-low rounded-full flex items-center gap-2 border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-[18px]" style="font-variation-settings: 'FILL' 1;">visibility_off</span>
<span class="font-label-md text-label-md text-secondary">Modo Discreto Activo</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 h-[72px] bg-surface dark:bg-inverse-surface shadow-[0px_-4px_12px_rgba(0,0,0,0.05)]">
<!-- Inicio (Active) -->
<div class="flex flex-col items-center justify-center bg-primary-container dark:bg-secondary text-on-primary-container dark:text-on-secondary rounded-full px-4 py-1 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md-mobile">Inicio</span>
</div>
<!-- Historial -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:opacity-80 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md-mobile">Historial</span>
</div>
<!-- Red de Apoyo -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:opacity-80 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined">group_add</span>
<span class="font-label-md text-label-md-mobile">Red de Apoyo</span>
</div>
<!-- Ajustes -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant hover:opacity-80 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md-mobile">Ajustes</span>
</div>
</nav>
<script>
        // Simple micro-interaction for vibration and feedback
        document.addEventListener('DOMContentLoaded', () => {
            const hapticFeedback = () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate([50, 30, 50]);
                }
            };
            
            // Repeat haptic every 1 second during activation
            const hapticInterval = setInterval(hapticFeedback, 1000);
            
            // Clean up if needed (this is a static UI simulation)
            setTimeout(() => {
                clearInterval(hapticInterval);
            }, 3000);
        });
    </script>
</body></html>
