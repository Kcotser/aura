<body class="bg-background text-on-background min-h-[844px] w-[390px] mx-auto relative overflow-hidden shadow-2xl">
<!-- Top App Bar (Background Content) -->
<header class="sticky top-0 w-full z-10 flex items-center justify-between px-4 h-[64px] bg-surface">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary p-2 hover:bg-surface-container rounded-full transition-colors">arrow_back</button>

</div>
<button class="material-symbols-outlined text-on-surface-variant p-2">more_vert</button>
</header>
<!-- Main Content Background (Settings view simulation) -->
<main class="p-md space-y-md opacity-40">
<section class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/20">
<h2 class="font-headline-md text-headline-md-mobile mb-xs">Configuración de Seguridad</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Personaliza cómo interactúas con la app en momentos críticos.</p>
</section>

<div class="h-[list-item-height] flex items-center justify-between px-md bg-surface-container-low rounded-lg">
<span class="font-body-lg text-body-lg">Contactos de emergencia</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<div class="h-[list-item-height] flex items-center justify-between px-md bg-surface-container-low rounded-lg">
<span class="font-body-lg text-body-lg">Modo Camuflaje</span>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
</main>
<!-- Bottom Sheet Backdrop -->
<div class="fixed inset-0 bg-black/40 z-40 transition-opacity duration-300" id="backdrop"></div>
<!-- Bottom Sheet 'Configurar Atajo Rápido' -->
<div class="fixed bottom-0 left-0 right-0 h-[55%] bg-surface-container-lowest rounded-t-[28px] z-50 shadow-[0px_-8px_24px_rgba(0,0,0,0.12)] bottom-sheet-transition flex flex-col overflow-hidden" id="bottom-sheet">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-2">
<div class="w-8 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-md pb-xl flex-1 flex flex-col">
<h2 class="font-headline-lg text-headline-lg-mobile text-on-surface mb-md">Atajo de Activación Rápida</h2>
<!-- Selection Area -->
<div class="flex-1 space-y-sm overflow-y-auto pr-1">
<!-- Radio Card 1 -->
<label class="radio-card block relative group cursor-pointer h-[list-item-height] border border-outline-variant rounded-xl px-md transition-all active:scale-95">
<input checked="" class="sr-only" name="shortcut" type="radio"/>
<div class="flex items-center h-full gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined">ads_click</span>
</div>
<div class="flex-1">
<p class="font-body-lg text-body-lg font-semibold text-on-surface">Triple clic</p>
<p class="font-label-md text-label-md text-on-surface-variant">Presiona el botón de encendido 3 veces</p>
</div>
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-primary-container flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-primary-container rounded-full"></div>
</div>
</div>
</label>
<!-- Radio Card 2 -->
<label class="radio-card block relative group cursor-pointer h-[list-item-height] border border-outline-variant rounded-xl px-md transition-all active:scale-95">
<input class="sr-only" name="shortcut" type="radio"/>
<div class="flex items-center h-full gap-md">

</div>

</div>

</div>

<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md-mobile">Ajustes</span>
</div>

<script>
        // Micro-interactions for Radio Cards
        const radioLabels = document.querySelectorAll('.radio-card');
        
        function updateUI() {
            radioLabels.forEach(label => {
                const input = label.querySelector('input');
                const indicator = label.querySelector('.radio-indicator');
                const dot = indicator.querySelector('div');

                if (input.checked) {
                    label.classList.add('border-primary-container', 'bg-primary-container/5');
                    label.classList.remove('border-outline-variant');
                    indicator.classList.add('border-primary-container');
                    indicator.classList.remove('border-outline-variant');
                    dot.classList.remove('bg-transparent');
                    dot.classList.add('bg-primary-container');
                } else {
                    label.classList.remove('border-primary-container', 'bg-primary-container/5');
                    label.classList.add('border-outline-variant');
                    indicator.classList.remove('border-primary-container');
                    indicator.classList.add('border-outline-variant');
                    dot.classList.add('bg-transparent');
                    dot.classList.remove('bg-primary-container');
                }
            });
        }

        radioLabels.forEach(label => {
            label.addEventListener('click', () => {
                setTimeout(updateUI, 10);
            });
        });

        // Initialize UI state
        updateUI();

        // Simple sheet closing simulation
        document.getElementById('backdrop').addEventListener('click', () => {
            document.getElementById('bottom-sheet').style.transform = 'translateY(100%)';
            document.getElementById('backdrop').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('backdrop').style.display = 'none';
            }, 400);
        });
    </script>
