<span class="material-symbols-outlined text-[64px] text-white" style="font-variation-settings: 'FILL' 1;">shield_person</span>

</div>

<div class="bg-white/5 border border-white/10 rounded-xl p-md backdrop-blur-sm relative overflow-hidden group">

<span class="text-white font-label-md">Privacidad Total</span>

<script>
        // Simple fade-in animation for the logo area
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-fade-in');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    el.style.transition = 'all 0.8s ease-out';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 200 * index);
            });
        });
    </script>
