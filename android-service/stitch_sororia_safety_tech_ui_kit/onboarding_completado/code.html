<style>

            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .success-check-animation {
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .content-card {
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.1);

            z-index: 10;

<script>
        // Generate Starry Constellation Background
        const constellation = document.getElementById('constellation');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            const size = Math.random() * 3 + 1 + 'px';
            star.style.width = size;
            star.style.height = size;
            
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            
            const duration = Math.random() * 3 + 2 + 's';
            star.style.setProperty('--duration', duration);
            
            const delay = Math.random() * 5 + 's';
            star.style.animationDelay = delay;
            
            const opacity = Math.random() * 0.5 + 0.2;
            star.style.opacity = opacity;
            
            constellation.appendChild(star);
        }

        // Add some "lines" for the constellation effect (limited)
        for (let j = 0; j < 5; j++) {
            const line = document.createElement('div');
            line.className = 'absolute bg-white/10 origin-left';
            line.style.height = '1px';
            line.style.width = Math.random() * 100 + 100 + 'px';
            line.style.left = Math.random() * 100 + '%';
            line.style.top = Math.random() * 100 + '%';
            line.style.transform = `rotate(${Math.random() * 360}deg)`;
            constellation.appendChild(line);
        }

        // Simple click interaction for the button
        document.querySelector('button').addEventListener('mousedown', function() {
            this.style.backgroundColor = '#f0f0f0';
        });
        document.querySelector('button').addEventListener('mouseup', function() {
            this.style.backgroundColor = '#ffffff';
        });
    </script>
