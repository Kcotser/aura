<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#006878",
                    "primary-container": "#5a189a",
                    "secondary-fixed-dim": "#58d6f1",
                    "on-primary-fixed": "#2b0052",
                    "surface-container-high": "#e4e9eb",
                    "on-tertiary-container": "#54bf8e",
                    "on-primary": "#ffffff",
                    "outline-variant": "#cec3d4",
                    "inverse-primary": "#dbb8ff",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "on-surface-variant": "#4b4452",
                    "surface": "#f5fafc",
                    "on-tertiary-fixed-variant": "#005235",
                    "secondary-fixed": "#a7edff",
                    "error": "#ba1a1a",
                    "on-secondary-fixed": "#001f25",
                    "secondary-container": "#69e5ff",
                    "on-surface": "#171c1e",
                    "primary-fixed": "#efdbff",
                    "on-primary-container": "#c896ff",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f5fafc",
                    "tertiary-fixed": "#8df7c2",
                    "outline": "#7d7483",
                    "inverse-surface": "#2c3133",
                    "surface-tint": "#7a3fbb",
                    "on-background": "#171c1e",
                    "on-secondary-fixed-variant": "#004e5b",
                    "surface-dim": "#d6dbdd",
                    "tertiary-fixed-dim": "#71daa7",
                    "surface-variant": "#dee3e5",
                    "surface-container-highest": "#dee3e5",
                    "tertiary-container": "#004a30",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#ecf1f3",
                    "on-tertiary-fixed": "#002113",
                    "tertiary": "#00311f",
                    "primary-fixed-dim": "#dbb8ff",
                    "surface-container": "#eaeff1",
                    "surface-container-low": "#eff4f6",
                    "background": "#f5fafc",
                    "on-primary-fixed-variant": "#6122a1",
                    "primary": "#3f0075"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target-min": "44px",
                    "xs": "8px",
                    "lg": "24px",
                    "sm": "12px",
                    "button-height": "48px",
                    "md": "16px",
                    "xl": "32px",
                    "input-height": "52px",
                    "list-item-height": "64px",
                    "base": "4px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "critical-data": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "critical-data": ["18px", {"lineHeight": "24px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f5fafc; overflow: hidden; }
        .bottom-sheet-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s ease-out;
        }
        .bottom-sheet-content {
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            height: 50vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .check-animation {
            animation: scale-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes scale-up {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center min-h-screen">
<!-- Parent Screen Background (Simplified Preview) -->
<main class="w-full h-screen max-w-[390px] bg-background flex flex-col relative overflow-hidden">
<!-- Top App Bar (From Shared Components) -->
<header class="sticky top-0 w-full z-10 flex items-center justify-between px-4 h-[64px] bg-surface dark:bg-surface-dim">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:bg-surface-container rounded-full p-2 transition-colors duration-200">arrow_back</span>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-inverse-primary">SororIA</h1>
</div>
</header>
<!-- Mock Background Content -->
<section class="p-4 flex flex-col gap-4 opacity-30 pointer-events-none">
<div class="h-32 bg-surface-container-high rounded-xl animate-pulse"></div>
<div class="h-16 bg-surface-container rounded-lg animate-pulse"></div>
<div class="h-48 bg-surface-container-highest rounded-xl animate-pulse"></div>
</section>
<!-- Bottom Sheet Overlay -->
<div class="bottom-sheet-overlay absolute inset-0 z-40 flex items-end justify-center">
<!-- Bottom Sheet Container (50% height mandated) -->
<div class="bottom-sheet-content bg-surface-container-lowest w-full rounded-t-[28px] shadow-[0px_-8px_24px_rgba(0,0,0,0.12)] flex flex-col items-center p-6 z-50">
<!-- Handle -->
<div class="w-8 h-1 bg-outline-variant rounded-full mb-8"></div>
<!-- Success Content -->
<div class="flex flex-col items-center text-center w-full max-w-xs flex-grow">
<!-- Icono check verde grande -->
<div class="w-20 h-20 bg-on-tertiary-container/10 rounded-full flex items-center justify-center mb-6 check-animation">
<span class="material-symbols-outlined text-[48px] text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Título: Reporte Aprobado -->
<h2 class="font-headline-lg text-headline-lg-mobile text-on-surface mb-2">Reporte Aprobado</h2>
<!-- Texto: Guardado en tu historial -->
<p class="font-body-md text-body-md text-on-surface-variant mb-10">Guardado en tu historial</p>
<!-- Buttons Group -->
<div class="flex flex-col w-full gap-3 mt-auto">
<!-- Botón violeta "Ver en mi Historial" -->
<button class="h-button-height w-full bg-primary-container text-on-primary font-body-lg text-body-lg rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform">
                            Ver en mi Historial
                        </button>
<!-- Botón "Volver a Inicio" -->
<button class="h-button-height w-full bg-surface-container-high text-on-surface font-body-lg text-body-lg rounded-full flex items-center justify-center active:scale-95 transition-transform">
                            Volver a Inicio
                        </button>
</div>
</div>
</div>
</div>
</main>
<!-- No Bottom Navigation as requested -->
<script>
        // Micro-interactions for button feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });

        // Prevention of accidental scrolling on the background while modal is open
        document.body.style.overflow = 'hidden';
    </script>
</body></html>
