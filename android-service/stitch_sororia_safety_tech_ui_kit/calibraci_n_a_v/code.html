<style>

<body class="flex items-center justify-center min-h-screen">
<div class="w-[390px] h-[844px] bg-background relative overflow-hidden shadow-2xl flex flex-col" id="app-container">
<!-- TopAppBar (Based on JSON) -->
<header class="sticky top-0 w-full z-50 flex items-center justify-between px-4 h-[64px] bg-surface dark:bg-surface-dim">
<div class="flex items-center gap-2 cursor-pointer transition-colors duration-200 hover:bg-surface-container rounded-full p-2">
<span class="material-symbols-outlined text-primary">arrow_back</span>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary">Ajustes</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering title if needed -->
</header>
<!-- Main Content (Bento/Card Layout) -->
<main class="flex-1 overflow-y-auto px-md py-lg space-y-lg">
<!-- Page Instruction -->
<div class="space-y-base">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Calibración de Audio y Video</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Configura la calidad de transmisión para situaciones de emergencia.</p>
</div>
<!-- Resolution Slider Section -->
<section class="bg-surface-container-lowest p-xl rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] space-y-xl">
<div class="flex items-center justify-between">
<h3 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Resolución</h3>
<span class="material-symbols-outlined text-primary-container">speed</span>
</div>
<div class="relative pt-xs pb-xl">
<input class="custom-slider w-full h-2 bg-surface-container rounded-lg appearance-none cursor-pointer accent-primary" id="resolution-slider" max="2" min="0" step="1" type="range" value="1"/>
<div class="flex justify-between w-full mt-sm px-1">
<span class="font-label-md text-label-md text-on-surface-variant">Ahorro</span>
<span class="font-label-md text-label-md text-on-surface-variant font-bold text-primary">Balanceado</span>
<span class="font-label-md text-label-md text-on-surface-variant">Máxima</span>
</div>
</div>
<!-- Info Card: Savings Highlight -->
<div class="bg-primary-fixed text-on-primary-fixed p-md rounded-lg flex items-start gap-md animate-pulse" id="savings-card">
<span class="material-symbols-outlined mt-1">bolt</span>
<div>
<p class="font-body-md text-body-md font-bold">Modo Ahorro Activo</p>
<p class="font-label-md text-label-md">Envío de video 3x más rápido en zonas de baja cobertura.</p>
</div>
</div>
</section>
<!-- Priority Toggle Section -->
<section class="bg-surface-container-lowest p-xl rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<label class="flex items-center justify-between cursor-pointer">
<div class="space-y-base pr-xl">
<span class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Priorizar envío rápido</span>
<p class="font-body-md text-body-md text-on-surface-variant">Inicia el streaming antes aunque la calidad sea menor inicialmente.</p>
</div>
<div class="relative inline-block w-12 h-6 transition duration-200 ease-in-out">
<input checked="" class="opacity-0 w-0 h-0 peer" id="toggle-priority" type="checkbox"/>
<span class="absolute cursor-pointer top-0 left-0 right-0 bottom-0 bg-outline rounded-full transition-all duration-300 peer-checked:bg-primary before:content-[''] before:absolute before:h-4 before:w-4 before:left-1 before:bottom-1 before:bg-white before:rounded-full before:transition-all before:duration-300 peer-checked:before:translate-x-6"></span>
</div>
</label>
</section>
<!-- Preview/Visual Placeholder -->
<div class="relative rounded-xl overflow-hidden h-40 bg-surface-container-highest group">
<div class="w-full h-full bg-cover bg-center opacity-70 group-hover:scale-105 transition-transform duration-700" data-alt="A cinematic, high-quality digital illustration of a smartphone screen displaying a secure encrypted video feed. The lighting is moody with violet and blue neon accents reflecting off the glass surface. The background shows a stylized, blurred urban environment at night. The visual style is sleek and corporate-modern, emphasizing reliability and technological sophistication." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDIsoQ51f75S4cY5Bilkr-bdF5KjIk_zojua-CjI9M5cRd4FbGaINKargSAbGojZZi4CTtAAwYVaNEaMETdlNZwQGv9IjCaMK8ErEJvFjTwKaSRluW-n0hmfs6YYoEZPCbhNrK2b-rDeRCyLKFGIzl0L3-f9EjuNjtT73Zwbw2ll0a455oYSPqkfhFHVrYSFVcsVjg54WRmW6Hwpsjj3f6grBTX5cgArbB9m3j3Az7MuDFYp5lQIzMHE17NlC2g_NWwAQoKUh9f6fk')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-md">
<div class="flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-error animate-ping"></span>
<span class="font-label-md text-label-md text-white">Previsualización de calibración</span>
</div>
</div>
</div>
</main>
<!-- Footer Action (The Violet Button) -->
<footer class="p-lg bg-surface border-t border-surface-variant/20">
<button class="w-full h-button-height bg-primary text-on-primary rounded-full font-headline-md-mobile text-headline-md-mobile flex items-center justify-center gap-sm active:scale-95 transition-transform shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">save</span>
                Guardar configuración
            </button>
</footer>
</div>
<script>
        // Micro-interactions for the slider
        const slider = document.getElementById('resolution-slider');
        const labels = slider.nextElementSibling.children;
        const infoCard = document.getElementById('savings-card');

        slider.addEventListener('input', (e) => {
            const val = e.target.value;
            
            // Reset labels
            for(let label of labels) {
                label.classList.remove('font-bold', 'text-primary');
            }
            
            // Set active label
            labels[val].classList.add('font-bold', 'text-primary');

            // Show/Hide info card logic (Simplified for demo)
            if(val == 0) {
                infoCard.classList.remove('hidden');
                infoCard.querySelector('p').innerText = "Modo Ahorro Activo";
                infoCard.querySelector('p:last-child').innerText = "Envío de video 3x más rápido en zonas de baja cobertura.";
            } else if(val == 1) {
                infoCard.classList.remove('hidden');
                infoCard.querySelector('p').innerText = "Modo Balanceado";
                infoCard.querySelector('p:last-child').innerText = "Equilibrio óptimo entre nitidez y velocidad de carga.";
            } else {
                infoCard.querySelector('p').innerText = "Modo Máxima Resolución";
                infoCard.querySelector('p:last-child').innerText = "Requiere conexión 5G o Wi-Fi estable para evitar cortes.";
            }
        });

        // Simple button feedback
        document.querySelector('button').addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Guardando...';
            this.disabled = true;
            this.classList.add('opacity-80');
            
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Configuración guardada';
                this.classList.replace('bg-primary', 'bg-on-tertiary-container');
                
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.disabled = false;
                    this.classList.replace('bg-on-tertiary-container', 'bg-primary');
                    this.classList.remove('opacity-80');
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
