<script>
        // Simple micro-interaction for the play button
        const playBtn = document.getElementById('playToggle');
        let isPlaying = false;
        
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = playBtn.querySelector('.material-symbols-outlined');
            icon.textContent = isPlaying ? 'pause' : 'play_arrow';
            icon.setAttribute('data-icon', isPlaying ? 'pause' : 'play_arrow');
            
            // Fade effect for the button when playing
            if(isPlaying) {
                playBtn.style.opacity = "0.2";
            } else {
                playBtn.style.opacity = "1";
            }
        });

        // Hide controls after inactivity (simulated)
        let timeout;
        document.addEventListener('mousemove', () => {
            const controls = document.querySelectorAll('header, footer, .z-20');
            controls.forEach(el => el.style.opacity = "1");
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                if(isPlaying) {
                    controls.forEach(el => el.style.opacity = "0");
                }
            }, 3000);
        });
    </script>
